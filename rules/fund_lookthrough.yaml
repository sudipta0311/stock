  IVV: {basket: sp500, proxy: true}
  SPY: {basket: sp500}
  SPLG: {basket: sp500, proxy: true}
  QQQ: {basket: nasdaq100}
  QQQM: {basket: nasdaq100, proxy: true}
  URTH: {basket: msci_world, proxy: true}
  ACWI: {basket: msci_acwi, proxy: true}
