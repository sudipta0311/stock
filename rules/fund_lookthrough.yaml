version: 1
max_age_days: 21

# Public index baskets are used as holding proxies. Weights are reference data,
# never user-provided values.
baskets:
  sp500: {label: "S&P 500", source: ssga_spy, ticker: SPY}
  nasdaq100: {label: "NASDAQ 100", source: invesco, ticker: QQQ}
  msci_world: {label: "MSCI World", source: ssga_emea, ticker: sppw}
  msci_acwi: {label: "MSCI ACWI", source: ssga_emea, ticker: spyy}
  msci_acwi_imi: {label: "MSCI ACWI IMI", source: ssga_emea, ticker: spyi}
  msci_em: {label: "MSCI Emerging Markets", source: ssga_emea, ticker: spym}
  msci_india: {label: "MSCI India", source: derived, derived_from: msci_em}
  msci_em_ex_india: {label: "Emerging markets excluding India", source: derived, derived_from: msci_em}
  nifty50: {label: "NIFTY 50", source: nse, list: nifty50}
  niftynext50: {label: "NIFTY Next 50", source: nse, list: niftynext50}
  nifty100: {label: "NIFTY 100", source: nse, list: nifty100}
  niftymidcap150: {label: "NIFTY Midcap 150", source: nse, list: niftymidcap150}
  niftysmallcap250: {label: "NIFTY Smallcap 250", source: nse, list: niftysmallcap250}
  nifty500: {label: "NIFTY 500", source: nse, list: nifty500}
