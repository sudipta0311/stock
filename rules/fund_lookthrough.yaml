    basket: nifty500
    proxy: true
    name_keywords:
      - {any: [bank], basket: niftybank}
      - {any: [it, technology, information technology], basket: niftyit}
      - {any: [pharma, healthcare, health care], basket: niftypharma}
      - {any: [fmcg, consumption], basket: niftyfmcg}
      - {any: [auto, automobile], basket: niftyauto}
  Index Funds/ETFs:
    proxy: true
    name_keywords:
      - {any: [nifty next 50, nifty next50, junior bees], basket: niftynext50, exclude_any: []}
      - {any: [nifty 50, nifty50], basket: nifty50, exclude_any: [nifty next 50, nifty next50, nifty 500, nifty500]}
