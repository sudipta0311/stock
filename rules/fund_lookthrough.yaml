      - {any: [nifty 500, nifty500], basket: nifty500}
      - {any: [nifty bank, bank bees], basket: niftybank}
      - {any: [nifty it, nifty information technology], basket: niftyit}
      - {any: [nifty pharma], basket: niftypharma}
      - {any: [nifty fmcg], basket: niftyfmcg}
      - {any: [nifty auto], basket: niftyauto}
      - {any: [s&p 500, s&p500, sp 500, sp500], basket: sp500}
      - {any: [nasdaq 100, nasdaq100], basket: nasdaq100}
      - {any: [msci world], basket: msci_world}
      - {any: [msci acwi imi], basket: msci_acwi_imi}
      - {any: [msci acwi, all country world, all-country world], basket: msci_acwi}
      - {any: [msci india], basket: msci_india}
      - {any: [emerging markets, msci em], basket: msci_em}
  "International / FoF Overseas":
    proxy: true
    name_keywords:
      - {any: [s&p 500, s&p500, sp 500, sp500], basket: sp500}
      - {any: [nasdaq 100, nasdaq100], basket: nasdaq100}
      - {any: [msci world], basket: msci_world}
      - {any: [msci acwi imi], basket: msci_acwi_imi}
      - {any: [msci acwi, all country world, all-country world], basket: msci_acwi}
      - {any: [msci india], basket: msci_india}
      - {any: [emerging markets, msci em], basket: msci_em}

