  niftybank: {label: "NIFTY Bank", source: nse, list: niftybank}
  niftyit: {label: "NIFTY IT", source: nse, list: niftyit}
  niftypharma: {label: "NIFTY Pharma", source: nse, list: niftypharma}
  niftyfmcg: {label: "NIFTY FMCG", source: nse, list: niftyfmcg}
  niftyauto: {label: "NIFTY Auto", source: nse, list: niftyauto}

by_index_name:
