[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-copilot"
version = "0.1.0"
description = "A personal wealth planning and portfolio guidance application."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11", "pyyaml>=6.0"]

[project.optional-dependencies]
api = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.10",
    "alembic>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.20",
    "pypdf>=6.1",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pywebpush>=2.0",
]
importer = [
    "openpyxl>=3.1",
    "pypdf>=6.1",
    "httpx>=0.28",
]
research = []
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "fpdf2>=2.8.4",
    "jsonschema>=4.23",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.10",
    "alembic>=1.14",
    "httpx>=0.28",
    "jinja2>=3.1",
    "psutil>=6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wealth = ["alerts/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["legacy", "apps", "azure-cli-2.90.0-x64"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: requires a PostgreSQL test database"]
