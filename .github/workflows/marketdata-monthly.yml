name: Monthly fund history

on:
  schedule:
    - cron: "0 3 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketdata-monthly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OWNER_DATABASE_URL: ${{ secrets.OWNER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-cache-dir -e ".[api,importer]"
      - name: Refresh month-end AMFI history
        run: python -m wealth.marketdata.refresh --only amfi_history
