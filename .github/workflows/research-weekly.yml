name: Weekly research

on:
  schedule:
    - cron: "0 0 * * 6"
    - cron: "0 2-20/2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-weekly
  cancel-in-progress: false

jobs:
  research:
    # Kept off until the reviewer completes the live smoke and enables the repository variable.
    if: vars.RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OWNER_DATABASE_URL: ${{ secrets.OWNER_DATABASE_URL }}
      FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
      FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
      FOUNDRY_MODEL_WORKHORSE: ${{ secrets.FOUNDRY_MODEL_WORKHORSE }}
      FOUNDRY_MODEL_REDTEAM: ${{ secrets.FOUNDRY_MODEL_REDTEAM }}
      RESEARCH_BUDGET_USD: ${{ vars.RESEARCH_BUDGET_USD || 5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-cache-dir -e ".[api,importer,research]"
      - name: Start the weekly run
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 6'
        run: |
          WEEK=$(date -u +%G-W%V)
          python -m wealth.research.watchers --week "$WEEK"
          python -m wealth.research.run start --week "$WEEK" --mode weekly --budget-usd "$RESEARCH_BUDGET_USD"
      - name: Continue the open weekly run
        if: github.event_name == 'schedule' && github.event.schedule != '0 0 * * 6'
        run: |
          WEEK=$(date -u +%G-W%V)
          python -m wealth.research.run continue --week "$WEEK"
