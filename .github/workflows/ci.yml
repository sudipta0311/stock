name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: wealth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wealth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_PASSWORD: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Create the non-superuser migration owner
        run: |
          CI_OWNER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export CI_OWNER_PASSWORD
          PGPASSWORD="$POSTGRES_PASSWORD" psql --host localhost --username postgres --dbname wealth_test --set ON_ERROR_STOP=1 --command "CREATE ROLE wealth_owner LOGIN CREATEDB CREATEROLE BYPASSRLS PASSWORD '${CI_OWNER_PASSWORD}'"
          PGPASSWORD="$POSTGRES_PASSWORD" psql --host localhost --username postgres --dbname wealth_test --set ON_ERROR_STOP=1 --command "ALTER DATABASE wealth_test OWNER TO wealth_owner"
          python - <<'PY'
          import os
          from urllib.parse import quote

          password = quote(os.environ["CI_OWNER_PASSWORD"], safe="")
          url = "postgresql+psycopg://" + "wealth_owner:" + password + "@localhost:5432/wealth_test"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"TEST_DATABASE_URL={url}\n")
              environment.write(f"OWNER_DATABASE_URL={url}\n")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[api,importer,research,dev]"
      - run: alembic upgrade head
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Run deterministic research eval
        run: python -m wealth.research.evals run --router fake --cases evals/golden --out out/evals/ci
      - run: pytest

  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run gen:api
        working-directory: apps/web
      - run: npm run gen:copy
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      # Only the build sees deploy-like values: tests mock same-origin API calls, so a
      # job-wide VITE_API_URL would send them to another host and break the mocks.
      - run: npm run build
        working-directory: apps/web
        env:
          VITE_API_URL: https://wealth-api.onrender.com
          VITE_AUTH_MODE: oidc
          VITE_OIDC_AUTHORITY: https://accounts.google.com
          VITE_OIDC_CLIENT_ID: ci-client-id
          VITE_OIDC_AUDIENCE: ci-client-id
      - run: npm test
        working-directory: apps/web
      - run: npm run budget
        working-directory: apps/web

  generated-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[api]"
      - run: python -m wealth.api.export_openapi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run gen:api
        working-directory: apps/web
      - run: git diff --exit-code -- schemas/openapi.json apps/web/src/api/schema.d.ts apps/web/src/api/features.generated.ts

  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/redesign/v2')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: wealth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wealth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_PASSWORD: ${{ github.run_id }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Create the non-superuser migration owner
        run: |
          CI_OWNER_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export CI_OWNER_PASSWORD
          PGPASSWORD="$POSTGRES_PASSWORD" psql --host localhost --username postgres --dbname wealth_test --set ON_ERROR_STOP=1 --command "CREATE ROLE wealth_owner LOGIN CREATEDB CREATEROLE BYPASSRLS PASSWORD '${CI_OWNER_PASSWORD}'"
          PGPASSWORD="$POSTGRES_PASSWORD" psql --host localhost --username postgres --dbname wealth_test --set ON_ERROR_STOP=1 --command "ALTER DATABASE wealth_test OWNER TO wealth_owner"
          python - <<'PY'
          import os
          from urllib.parse import quote

          password = quote(os.environ["CI_OWNER_PASSWORD"], safe="")
          url = "postgresql+psycopg://" + "wealth_owner:" + password + "@localhost:5432/wealth_test"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"TEST_DATABASE_URL={url}\n")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[api,importer,dev]"
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test --grep-invert @performance
        working-directory: e2e
      - name: Check load speed (reported, not blocking)
        # The 2.5 s LCP target under 4x CPU and slow 4G is not met yet (about 3.5 s);
        # the target stays as written and the result goes into out/e2e/perf.json.
        continue-on-error: true
        run: npx playwright test --grep @performance
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: out/e2e/
          if-no-files-found: ignore
