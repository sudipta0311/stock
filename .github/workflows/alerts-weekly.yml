name: Weekly local-time email

on:
  schedule:
    - cron: "0 * * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerts-weekly
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OWNER_DATABASE_URL: ${{ secrets.OWNER_DATABASE_URL }}
      EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_LINK_SECRET: ${{ secrets.EMAIL_LINK_SECRET }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-cache-dir ".[api]"
      - name: Compute this ISO week
        run: echo "ISO_WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"
      - run: python -m wealth.alerts.weekly --week "$ISO_WEEK" --local-hour 8
