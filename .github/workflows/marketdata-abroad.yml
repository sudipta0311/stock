name: Overseas market data

on:
  schedule:
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketdata-abroad
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OWNER_DATABASE_URL: ${{ secrets.OWNER_DATABASE_URL }}
      PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-cache-dir ".[api,importer]"
      - name: Refresh overseas prices when the source is available
        run: |
          if [ -z "${PRICE_API_KEY:-}" ]; then
            echo "::notice::Overseas price API key is not configured; skipping."
            exit 0
          fi
          if python -c "import sys; from wealth.marketdata import refresh; sys.exit(0 if {'eu_etfs', 'us_stocks'} <= set(refresh._SOURCES) else 78)"; then
            python -m wealth.marketdata.refresh --only eu_etfs,us_stocks
          else
            result=$?
            if [ "$result" -ne 78 ]; then exit "$result"; fi
            echo "::notice::Overseas price sources are not available yet; skipping."
          fi
