name: Daily data health

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: Optional ISO datetime in UTC for a rerun
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: data-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OWNER_DATABASE_URL: ${{ secrets.OWNER_DATABASE_URL }}
      EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
      HEALTH_NOW: ${{ inputs.now }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-cache-dir -e ".[api]"
      - name: Check stored data
        run: |
          if [ -n "${HEALTH_NOW:-}" ]; then
            python -m wealth.alerts.health --now "$HEALTH_NOW"
          else
            python -m wealth.alerts.health
          fi
