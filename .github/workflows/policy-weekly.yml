name: Weekly household plans

on:
  schedule:
    - cron: "30 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-weekly
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OWNER_DATABASE_URL: ${{ secrets.OWNER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-cache-dir ".[api]"
      - name: Compute this ISO week
        run: echo "ISO_WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"
      - run: python -m wealth.policy.run_weekly --week "$ISO_WEEK"
