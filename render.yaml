services:
  - type: web
    runtime: static
    name: wealth-pwa
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
      - key: VITE_AUTH_MODE
        value: oidc
      - key: VITE_OIDC_AUTHORITY
        sync: false
      - key: VITE_OIDC_CLIENT_ID
        sync: false
      - key: VITE_OIDC_AUDIENCE
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false

  - type: web
    name: wealth-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --no-cache-dir -e ".[api,importer]"
    startCommand: uvicorn wealth.api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      - key: AUTH_MODE
        value: oidc
      - key: MAX_UPLOAD_MB
        value: 10
      - key: CDSL_PARSER_BETA
        value: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_SESSION_SECRET
        sync: false
      - key: STATEMENT_PASSWORD_KEY
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_LINK_SECRET
        sync: false
